name: Deploy static Next.js site to Pages

on:
  # Runs on pushes targeting the migration branch
  push:
    branches: ['refactor/migration-to-nextjs']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      IS_STATIC: 'true'
      TMC_SERVER_URL: ${{ vars.TMC_SERVER_URL }}
      TOKEN_URL: ${{ vars.TOKEN_URL }}
      CATALOG_REPO_URL: ${{ vars.CATALOG_REPO_URL || 'https://github.com/wot-oss/example-catalog.git' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare local catalog
        if: env.TMC_SERVER_URL == ''
        run: |
          sh ci-cd/fetchRepository.sh "$CATALOG_REPO_URL" "$RUNNER_TEMP/pages-catalog"
          sh ci-cd/validateRequiredFiles.sh "$RUNNER_TEMP/pages-catalog"
          mkdir -p catalog public/catalog
          cp -R "$RUNNER_TEMP/pages-catalog/." catalog/
          cp -R "$RUNNER_TEMP/pages-catalog/." public/catalog/
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-node24-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**', 'public/**', 'next.config.ts', 'tsconfig.json', '*postcss*', '*tailwind*', '.github/workflows/deploy-gh-pages.yml') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-node24-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Verify static artifact
        run: test -f out/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
